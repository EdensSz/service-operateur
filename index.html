<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Opérateur</title>
<meta name="description" content="Service Opérateur — l'excellence opérationnelle, sans compromis.">
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4f1ea;
    --muted:rgba(244,241,234,.72);
    --line:rgba(244,241,234,.38);
    --bg:#05070d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font-family:'Inter',system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}

  /* Vidéo d'arrière-plan (aller-retour déjà intégré dans le fichier) */
  .bg{position:fixed;inset:0;overflow:hidden;background:#000}
  .bg video{
    position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;
    filter:blur(4px) brightness(.9) saturate(1.1);
    transform:translateZ(0);
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(ellipse at center, rgba(5,7,13,.05) 0%, rgba(5,7,13,.4) 90%),
      linear-gradient(to bottom, rgba(5,7,13,.2), rgba(5,7,13,0) 40%, rgba(5,7,13,.35));
  }

  main{
    position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 24px;
  }
  h1{
    font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;
    font-size:clamp(2.1rem,7vw,5.6rem);
    letter-spacing:.22em;text-transform:uppercase;line-height:1.1;
    padding-left:.22em; /* compense le letter-spacing pour un vrai centrage */
    opacity:0;transform:translateY(14px);animation:rise 1.6s .3s cubic-bezier(.2,.7,.2,1) forwards;
    text-shadow:0 2px 40px rgba(0,0,0,.35);
  }
  .rule{
    width:56px;height:1px;background:var(--line);margin:30px 0 26px;
    opacity:0;animation:rise 1.4s .9s ease forwards;
  }
  .tagline{
    font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;
    font-size:clamp(1.05rem,2.3vw,1.55rem);letter-spacing:.06em;color:var(--muted);
    opacity:0;animation:rise 1.4s 1.1s ease forwards;
  }
  .cta{
    margin-top:48px;cursor:pointer;
    font:400 .74rem/1 'Inter',sans-serif;letter-spacing:.32em;text-transform:uppercase;
    padding:20px 44px 20px calc(44px + .32em);
    color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:999px;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    transition:background .5s ease,border-color .5s ease,letter-spacing .5s ease;
    opacity:0;animation:rise 1.4s 1.4s ease forwards;
  }
  .cta:hover,.cta:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(244,241,234,.8);outline:none}
  @keyframes rise{to{opacity:1;transform:none}}

  /* Pop-up */
  .modal{
    position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgba(3,5,10,.55);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s;
  }
  .modal.open{opacity:1;visibility:visible}
  .card{
    position:relative;width:min(460px,100%);padding:52px 44px 44px;text-align:center;
    background:rgba(14,18,28,.72);border:1px solid rgba(244,241,234,.18);border-radius:18px;
    -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    transform:translateY(16px) scale(.985);transition:transform .55s cubic-bezier(.2,.7,.2,1);
  }
  .modal.open .card{transform:none}
  .close{
    position:absolute;top:14px;right:18px;width:36px;height:36px;border:0;background:none;
    color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1;
  }
  .close:hover{color:var(--ink)}
  .card h2{
    font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:1.9rem;
    letter-spacing:.08em;margin-bottom:10px;
  }
  .card p.sub{color:var(--muted);font-size:.9rem;line-height:1.6;margin-bottom:28px}
  form{display:flex;flex-direction:column;gap:14px}
  input[type=email]{
    width:100%;padding:17px 20px;font:300 .95rem 'Inter',sans-serif;color:var(--ink);
    background:rgba(255,255,255,.05);border:1px solid rgba(244,241,234,.25);border-radius:999px;
    outline:none;text-align:center;transition:border-color .3s,background .3s;
  }
  input[type=email]::placeholder{color:rgba(244,241,234,.45)}
  input[type=email]:focus{border-color:rgba(244,241,234,.75);background:rgba(255,255,255,.09)}
  .send{
    padding:17px 24px;cursor:pointer;font:400 .72rem 'Inter',sans-serif;letter-spacing:.3em;text-transform:uppercase;
    color:#0a0d14;background:var(--ink);border:0;border-radius:999px;transition:opacity .3s;
  }
  .send:hover{opacity:.88}
  .send[disabled]{opacity:.5;cursor:default}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
  .thanks{display:none;padding:18px 0 6px}
  .thanks h2{margin-bottom:14px}
  .err{color:#e8b4a8;font-size:.82rem;min-height:1.1em}
  .card.done form,.card.done > p.sub,.card.done > h2{display:none}
  .card.done .thanks{display:block}

  @media (prefers-reduced-motion:reduce){
    h1,.rule,.tagline,.cta{animation:none;opacity:1;transform:none}
  }
  @media (max-width:520px){
    .card{padding:46px 26px 34px}
    .cta{padding:18px 32px 18px calc(32px + .32em)}
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <video id="bgv" autoplay muted loop playsinline preload="auto" poster="poster.jpg">
    <source src="background.mp4" type="video/mp4">
  </video>
</div>

<main>
  <h1>Service Opérateur</h1>
  <div class="rule"></div>
  <p class="tagline">L'excellence opérationnelle, sans compromis.</p>
  <button class="cta" id="open" type="button">En savoir plus</button>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="card" id="card">
    <button class="close" id="close" type="button" aria-label="Fermer">&times;</button>
    <h2 id="mt">Restons en contact</h2>
    <p class="sub">Laissez-nous votre adresse e-mail, nous vous présenterons notre service.</p>
    <form id="form" novalidate>
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
      <input type="email" id="email" name="email" placeholder="votre@email.com" required autocomplete="email">
      <div class="err" id="err" role="alert"></div>
      <button class="send" id="send" type="submit">Envoyer</button>
    </form>
    <div class="thanks" aria-live="polite">
      <h2>Merci</h2>
      <p class="sub" style="margin:0">Un membre de notre équipe reviendra vers vous sous peu.</p>
    </div>
  </div>
</div>

<script>
  /* ====== RÉGLAGE : endpoint du formulaire (voir le guide, étape Formspree) ======
     Colle ici l'URL fournie par Formspree, ex : "https://formspree.io/f/abcdwxyz"
     Tant qu'elle est vide, le site fonctionne en mode démo : AUCUN e-mail n'est collecté. */
  var FORM_ENDPOINT = "https://formspree.io/f/xljbdjlp";

  var modal = document.getElementById('modal'),
      card  = document.getElementById('card'),
      form  = document.getElementById('form'),
      email = document.getElementById('email'),
      err   = document.getElementById('err'),
      send  = document.getElementById('send'),
      vid   = document.getElementById('bgv');

  function openModal(){ modal.classList.add('open'); setTimeout(function(){ email.focus(); }, 350); }
  function closeModal(){ modal.classList.remove('open'); }
  document.getElementById('open').addEventListener('click', openModal);
  document.getElementById('close').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    err.textContent = '';
    var v = email.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ err.textContent = "Merci d'entrer une adresse e-mail valide."; return; }
    if(form.elements['_gotcha'].value){ return; } /* anti-spam */

    function done(){ card.classList.add('done'); }

    if(!FORM_ENDPOINT){ console.warn("FORM_ENDPOINT vide : mode démo, e-mail non enregistré."); done(); return; }

    send.disabled = true;
    fetch(FORM_ENDPOINT, {
      method:'POST',
      headers:{'Accept':'application/json','Content-Type':'application/json'},
      body:JSON.stringify({ email:v, source:'site-service-operateur' })
    }).then(function(r){
      if(r.ok){ done(); } else { throw new Error('http'); }
    }).catch(function(){
      err.textContent = "Une erreur est survenue, merci de réessayer.";
      send.disabled = false;
    });
  });

  /* Relance de la vidéo si le navigateur la met en pause (économie d'énergie, onglet masqué…) */
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ vid.play().catch(function(){}); } });
  vid.play().catch(function(){});
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ vid.pause(); }
</script>
</body>
</html>
